<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Felipe Mota">
  <meta name="keywords" content="Gestor de água, gestão de água, consumo de água, hidratação">
  <meta name="description" content="Gestor de água consumida diariamente">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="style.css">
  <title>H2O Tracker</title>
</head>
<body>  

  <div class="container">
    <h2>Quanta água você já bebeu hoje?</h2>
    <div class="consumed" id="waterAmount">0ml</div>
    <p id="goalDisplay">Meta: 0ml</p>

    <!-- Botão para abrir o balão -->
    <button id="openGoalModal">Definir Meta</button>

    <div class="input-area">
      <input type="number" id="inputMl" placeholder="Digite a quantidade" min="0" >
      <button onclick="addWater()">+</button>
    </div>

    <!-- Barra de progresso -->
    <div id="progressContainer">
      <div id="progressBar">0%</div>
    </div>

    <!-- Semana -->
    <div id="weekAmount"></div>

    <div class="countdown">
      faltam <strong id="countdown">--:--:--</strong> para acabar o dia.
    </div>

    <!-- Botão para alternar entre tema claro e escuro -->
    <button id="themeToggle" aria-label="Alternar tema">🌙</button>
</div>

<!-- Balão (modal) da meta -->
  <div id="goalModal" class="modal">
    <div class="modal-content">
      <span style="color:black" class="close">&times;</span>
      <input type="number" id="goalInput" placeholder="Digite a meta">
      <button onclick="setGoal()">Salvar</button>
    </div>
  </div>

  <div class="logo">
    <img src="img/tracker.png" alt="H2OTracker Logo">
  </div>

  <script src="script.js"></script>
</body>
</html>
