<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>H2O Tracker</title>
</head>
<body>

  <div class="container">
    <h1>Quantidade consumida</h1>

    <div class="consumed" id="waterAmount">0ml</div>
    <p id="goalDisplay">Meta: 0ml</p>
    <button id="openGoalModal">Definir Meta</button>

    <div class="input-area">
      <input type="number" id="inputMl" placeholder="Adicionar" min="1">
      <button type="button" onclick="addWater()">+</button>
    </div>

    <div id="progressContainer">
      <div id="progressBar">0%</div>
    </div>

    <div id="weekAmount" class="week"></div>

    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>

  <!-- MODAL META DE ÁGUA -->
  <div id="goalModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <input type="number" id="goalInput" placeholder="Meta" min="1">
      <button onclick="setGoal()">Salvar</button>
    </div>
  </div>

</body>
</html>
